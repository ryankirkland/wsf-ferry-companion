[project]
name = "wsf-notify"
version = "0.1.0"
description = "M3 alert notifications: subscription API, fan-out notifier, suppression."
requires-python = ">=3.12"
dependencies = [
    "wsf-core",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[s3,dynamodb,ssm,ses,sns,sqs]>=5",
]

[tool.uv.sources]
wsf-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsf_notify"]
