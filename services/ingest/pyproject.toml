[project]
name = "wsf-ingest"
version = "0.1.0"
description = "Realtime ingestion: vessellocations poller and dims refresher Lambdas."
requires-python = ">=3.12"
dependencies = [
    "wsf-core",
    "boto3>=1.43.72",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[s3,dynamodb,ssm]>=5",
]

[tool.uv.sources]
wsf-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsf_ingest"]
