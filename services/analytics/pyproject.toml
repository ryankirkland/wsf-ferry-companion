[project]
name = "wsf-analytics"
version = "0.1.0"
description = "M4 analytics: vesselhistory sync/backfill, capacity poller, transform, stats."
requires-python = ">=3.12"
dependencies = [
    "wsf-core",
    "boto3>=1.34",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[s3,dynamodb,ssm]>=5.2.2",
]

[tool.uv.sources]
wsf-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsf_analytics"]
