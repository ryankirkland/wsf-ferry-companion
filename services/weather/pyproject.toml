[project]
name = "wsf-weather"
version = "0.1.0"
description = "F6 weather: NWS + AirNow per-terminal conditions poller Lambda."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[s3,ssm]>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsf_weather"]
