# Main-branch lane: re-plan and apply envs/prod under wsf-github-apply.
# Re-planning on main (rather than trusting a PR artifact) keeps the applied
# plan attributable to the merged commit; it is shown in the step summary
# immediately before apply. The concurrency group serializes applies - the
# S3 state lockfile is the backstop, not the mechanism.
# Bootstrap (infra/bootstrap) is deliberately never applied by CI: it owns
# the state bucket and these CI roles, and is applied locally by a human.
name: infra apply

on:
  push:
    branches: [main]
    # The Lambda zip is built here from workspace sources, so source-only
    # merges must trigger an apply too - source_code_hash changes the plan.
    # (Gap found 2026-07-29: a services/libs-only merge shipped no Lambda.)
    paths:
      - "infra/**"
      - "services/**"
      - "libs/**"
      - "tools/build_lambda_zip.py"
      - "uv.lock"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-prod-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"

jobs:
  apply:
    name: apply (envs/prod)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # Same deterministic artifact the plan lane built - see infra-plan.yml.
      - name: build ingest lambda artifact
        run: |
          uv build --wheel --package wsf-core --out-dir .build/wheels
          uv build --wheel --package wsf-ingest --out-dir .build/wheels
          uv pip install .build/wheels/*.whl --target .build/ingest-src \
            --python-platform aarch64-manylinux2014 --python-version 3.12 \
            --only-binary :all: --no-cache
          python3 tools/build_lambda_zip.py .build/ingest-src infra/envs/prod/.build/ingest.zip

      - name: build notify lambda artifact
        run: |
          uv build --wheel --package wsf-notify --out-dir .build/wheels
          uv pip install .build/wheels/wsf_core-*.whl .build/wheels/wsf_notify-*.whl \
            --target .build/notify-src \
            --python-platform aarch64-manylinux2014 --python-version 3.12 \
            --only-binary :all: --no-cache
          python3 tools/build_lambda_zip.py .build/notify-src infra/envs/prod/.build/notify.zip

      - name: build analytics lambda artifact
        run: |
          uv build --wheel --package wsf-analytics --out-dir .build/wheels
          uv build --wheel --package wsf-ingest --out-dir .build/wheels || true
          uv pip install .build/wheels/wsf_core-*.whl .build/wheels/wsf_ingest-*.whl .build/wheels/wsf_analytics-*.whl \
            --target .build/analytics-src \
            --python-platform aarch64-manylinux2014 --python-version 3.12 \
            --only-binary :all: --no-cache
          python3 tools/build_lambda_zip.py .build/analytics-src infra/envs/prod/.build/analytics.zip

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::654654574183:role/wsf-github-apply
          aws-region: us-west-2

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir=infra/envs/prod init -input=false

      - name: terraform plan
        run: terraform -chdir=infra/envs/prod plan -input=false -no-color -out=tfplan

      - name: plan summary
        run: |
          {
            echo "## Applying plan - envs/prod"
            echo '```'
            terraform -chdir=infra/envs/prod show -no-color tfplan | head -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply
        run: terraform -chdir=infra/envs/prod apply -input=false tfplan
