# Deploys the static export to the web bucket on merge to main.
#
# TWO JOBS ON PURPOSE. `pnpm install` runs thousands of transitive packages'
# postinstall hooks, and `pnpm build` runs plugin code - none of it audited by
# us. That work happens in `build`, which has NO AWS credentials and no
# id-token permission, and hands off a tarball. `deploy` takes the artifact,
# assumes a role scoped to exactly this bucket and distribution, and runs
# nothing but the AWS CLI. A compromised dependency therefore never shares a
# job with a credential it could wait for. (Before 2026-08-23 this was one job
# that built first and assumed AdministratorAccess three steps later.)
#
# Two-pass sync: hashed assets first with immutable caching (HTML must never
# reference missing chunks), then everything else with --delete sweeping
# stale files. One wildcard invalidation = one of 1,000 free monthly paths.
name: web deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-prod-deploy
  cancel-in-progress: false

env:
  WEB_BUCKET: wsf-prod-web-654654574183
  DISTRIBUTION_ID: E1ZEOCBXLOJE3Z

jobs:
  build:
    name: build (no credentials)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: unit tests
        run: pnpm test:unit

      - name: build (live data)
        run: pnpm build
        env:
          NEXT_PUBLIC_DATA_MODE: live

      - name: install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # MapLibre's browser tests contend for CPU and animation frames under
      # Playwright's default parallelism. One worker removes that contention;
      # retries stay off so a flaky test blocks deployment.
      - name: browser tests
        run: pnpm exec playwright test --workers=1 --retries=0

      # Tar preserves the tree exactly; upload-artifact alone would not keep
      # empty directories or permissions the sync relies on.
      - name: package the export
        run: tar -czf ../export.tgz -C out .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-export
          path: export.tgz
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: sync + invalidate
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-export

      - name: unpack the export
        run: mkdir -p out && tar -xzf export.tgz -C out

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::654654574183:role/wsf-github-web-deploy
          aws-region: us-west-2

      - name: sync hashed assets (immutable)
        run: |
          aws s3 sync out/ "s3://$WEB_BUCKET/" --exclude "*" --include "_next/static/*" \
            --cache-control "public,max-age=31536000,immutable" --only-show-errors

      - name: sync site (delete stale)
        run: |
          aws s3 sync out/ "s3://$WEB_BUCKET/" --exclude "_next/static/*" --delete \
            --cache-control "public,max-age=0,must-revalidate" --only-show-errors

      - name: invalidate
        run: |
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" --query Invalidation.Status --output text
