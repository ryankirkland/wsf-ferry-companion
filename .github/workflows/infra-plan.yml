# Pull-request lane: static checks (no credentials) + a read-only plan of
# envs/prod under the wsf-github-plan role. Fork PRs cannot mint OIDC tokens,
# so the plan job fails at credential exchange for forks; the checks job still
# runs. Acceptable for a solo repo - revisit if collaborators join.
name: infra plan

on:
  pull_request:
    paths:
      - "infra/**"
      - "services/**"
      - "libs/**"
      - "tools/build_lambda_zip.py"
      - "uv.lock"
      - ".github/workflows/infra-plan.yml"
      - ".github/workflows/infra-apply.yml"

permissions:
  contents: read

concurrency:
  group: infra-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "1"

jobs:
  checks:
    name: fmt / validate / tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: terraform fmt
        run: terraform fmt -check -recursive infra/

      - name: validate bootstrap
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra/bootstrap validate

      - name: validate envs/prod
        run: |
          terraform -chdir=infra/envs/prod init -backend=false -input=false
          terraform -chdir=infra/envs/prod validate

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: tflint
        working-directory: infra
        run: |
          tflint --init --config "$(pwd)/.tflint.hcl"
          tflint --recursive --config "$(pwd)/.tflint.hcl" --format compact

  plan:
    name: plan (envs/prod)
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # The ingest Lambda artifact must exist before terraform evaluates
      # filebase64sha256(): workspace packages as wheels, third-party deps as
      # binary-only cross-compiled for the arm64 Lambda runtime, zipped
      # deterministically so identical sources yield identical hashes.
      - name: build ingest lambda artifact
        run: |
          uv build --wheel --package wsf-core --out-dir .build/wheels
          uv build --wheel --package wsf-ingest --out-dir .build/wheels
          uv pip install .build/wheels/*.whl --target .build/ingest-src \
            --python-platform aarch64-manylinux2014 --python-version 3.12 \
            --only-binary :all: --no-cache
          python3 tools/build_lambda_zip.py .build/ingest-src infra/envs/prod/.build/ingest.zip

      - name: build notify lambda artifact
        run: |
          uv build --wheel --package wsf-notify --out-dir .build/wheels
          uv pip install .build/wheels/wsf_core-*.whl .build/wheels/wsf_notify-*.whl \
            --target .build/notify-src \
            --python-platform aarch64-manylinux2014 --python-version 3.12 \
            --only-binary :all: --no-cache
          python3 tools/build_lambda_zip.py .build/notify-src infra/envs/prod/.build/notify.zip

      - name: build analytics lambda artifact
        run: |
          uv build --wheel --package wsf-analytics --out-dir .build/wheels
          uv build --wheel --package wsf-ingest --out-dir .build/wheels || true
          uv pip install .build/wheels/wsf_core-*.whl .build/wheels/wsf_ingest-*.whl .build/wheels/wsf_analytics-*.whl \
            --target .build/analytics-src \
            --python-platform aarch64-manylinux2014 --python-version 3.12 \
            --only-binary :all: --no-cache
          python3 tools/build_lambda_zip.py .build/analytics-src infra/envs/prod/.build/analytics.zip

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::654654574183:role/wsf-github-plan
          aws-region: us-west-2

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir=infra/envs/prod init -input=false

      # -lock=false keeps this lane strictly read-only (ReadOnlyAccess cannot
      # write the S3 lockfile, and a plan must never block an apply anyway).
      - name: terraform plan
        run: terraform -chdir=infra/envs/prod plan -lock=false -input=false -no-color -out=tfplan

      - name: plan summary
        run: |
          {
            echo "## Terraform plan - envs/prod"
            echo '```'
            terraform -chdir=infra/envs/prod show -no-color tfplan | head -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
