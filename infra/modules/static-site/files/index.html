<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferry Sound</title>
<style>
  :root {
    --paper: #f6f3ec;
    --ink: #26333a;
    --ink-soft: #5d6d75;
    --accent: #007b5f;
    --water: #74a8b0;
    --line: #e2ddd0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #101a21;
      --ink: #dbe6e2;
      --ink-soft: #9fb3ad;
      --accent: #2fae8a;
      --water: #1f3a46;
      --line: #26363f;
    }
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;
    padding: 2rem;
  }
  main { max-width: 26rem; }
  svg { width: 130px; height: auto; margin-bottom: 1.75rem; }
  h1 {
    font-size: 1.6rem;
    font-weight: 650;
    letter-spacing: 0.01em;
    margin-bottom: 0.5rem;
  }
  h1 span { color: var(--accent); }
  p { color: var(--ink-soft); }
  .rule {
    width: 3rem;
    height: 2px;
    background: var(--line);
    margin: 1.5rem auto 0;
    border-radius: 1px;
  }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 130 74" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <path d="M35 30 h60 l-7 16 H42 Z" fill="var(--accent)" opacity="0.92"/>
    <rect x="48" y="20" width="34" height="10" rx="2" fill="var(--accent)" opacity="0.55"/>
    <path d="M12 52 q8 6 16 0 t16 0 t16 0 t16 0 t16 0 t16 0" stroke="var(--water)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M22 62 q8 5 16 0 t16 0 t16 0 t16 0 t16 0" stroke="var(--water)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55"/>
  </svg>
  <h1>Ferry <span>Sound</span></h1>
  <p>Something lovely is crossing the water. Arriving soon.</p>
  <div class="rule"></div>
</main>
</body>
</html>
